# One-off (17 Nov): list every TMDB logo, any language, for films with no title logo. Prints only, commits nothing.
name: Logo probe
on:
  push:
    branches: [fix/ripple-gaps]
    paths: ['.github/workflows/logo-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List logos
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          for id in 16874 16620 9942 754; do
            echo "== $id"
            curl -s "https://api.themoviedb.org/3/movie/$id/images?api_key=$TMDB_KEY" | python3 -c "import json,sys;d=json.load(sys.stdin);[print('LOGO',l['file_path'],l['width'],l['height'],l.get('iso_639_1'),l.get('vote_average')) for l in d.get('logos',[])];print('posters',len(d.get('posters',[])))"
          done
