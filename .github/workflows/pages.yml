# Publishes the site to GitHub Pages: only the files the site needs (no audit, docs, sweep, wip, tests or scripts).
# Runs on every push to main, or by hand from the Actions tab (Run workflow).
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Trim to the site files
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          cd _site
          rm -rf audit docs sweep wip tests scripts .github .netlify
          touch .nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
