name: Video store safety checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'video-store-refresh.css'
      - 'tests/**'
      - 'data/**'
      - 'films.js'
      - 'tmdb-posters.js'
      - '.github/workflows/video-store-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate existing watched-state tests
        run: node tests/watched-state.test.cjs
      - name: Validate existing poster and menu tests
        run: node tests/poster-menus.test.cjs
      - name: Check Video Store seasonal and rental wiring
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          const app=fs.readFileSync('app.js','utf8');
          const css=fs.readFileSync('video-store-refresh.css','utf8');
          for(const id of ['viewShop','shopCal','shopAisles','memberCard','shopSearch','shopDecade','shopSvc','shopUnwatched','shopKids','svBoard']){
            assert(html.includes('id="'+id+'"'), 'Missing shop element: '+id);
          }
          for(const name of ['seasonState','seasonRows','renderCal','renderMember','renderShop','openCase','openSlip','openChute','setSvc']){
            assert(new RegExp('function '+name+'\\(').test(app),'Missing shop function: '+name);
          }
          assert(html.includes('video-store-refresh.css'),'Retail stylesheet not linked');
          assert(html.includes('data-go="wall"'),'New releases entry missing');
          assert(html.includes('data-go="Staff picks"'),'Staff picks entry missing');
          assert(app.includes('cal.filter(c=>c.on)'),'Active seasonal shelves missing');
          assert(app.includes('cal.filter(c=>!c.on&&c.next)'),'Upcoming seasonal shelves missing');
          assert(app.includes('renderCal(cal)'),'Calendar render missing');
          assert(app.includes('renderMember()'),'Membership render missing');
          assert(app.includes('openSlip(f'),'Rental flow missing');
          assert(css.includes('#viewShop'),'Shop-specific CSS missing');
          console.log('Video Store wiring checks passed');
          NODE
