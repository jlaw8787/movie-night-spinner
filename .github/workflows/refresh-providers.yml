name: Refresh where to watch
on:
  schedule:
    - cron: '17 18 1 * *'   # 1st of every month, about 4am Brisbane time
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Australian streaming info from TMDB
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python3 scripts/refresh_providers.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Re-stamp the page so phones pick up the new list
        run: node scripts/build-data.cjs
      - name: Commit if changed
        run: |
          if git diff --quiet providers.js; then echo "No changes"; exit 0; fi
          git config user.name "movie-night-bot"
          git config user.email "actions@users.noreply.github.com"
          git add providers.js index.html sw.js
          git commit -m "Monthly where-to-watch refresh"
          git push
