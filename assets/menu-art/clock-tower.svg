<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" width="400" height="330">
<defs>
  <pattern id="h" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.3" height="4" fill="#111"/></pattern>
  <pattern id="hd" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.7" height="3" fill="#111"/></pattern>
  <pattern id="hv" width="3.2" height="3" patternUnits="userSpaceOnUse"><rect width="1.1" height="3" fill="#111"/></pattern>
  <pattern id="sky" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)"><rect width="7" height="1" fill="#111"/></pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="skym"><rect width="400" height="240" fill="url(#fade)"/></mask><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="400" height="330" fill="#fff"/>
<!-- storm sky: hatching that thins out toward the square -->
<g mask="url(#skym)"><rect width="400" height="240" fill="url(#sky)" opacity=".6"/><rect width="400" height="240" fill="url(#hd)" opacity=".38"/></g>
<ellipse cx="292" cy="70" rx="110" ry="80" fill="url(#glow)"/>
<!-- lightning: keylines first, then ink, round joins so the bolt never breaks -->
<g fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="M330 0 L306 40 L318 43 L286 86 L300 89 L262 128 L229 146" stroke="#fff" stroke-width="12"/><path d="M306 40 L334 62 L330 78" stroke="#fff" stroke-width="7"/><path d="M286 86 L256 98 L244 118" stroke="#fff" stroke-width="7"/><path d="M262 128 L276 150" stroke="#fff" stroke-width="7"/><path d="M330 0 L306 40 L318 43 L286 86 L300 89 L262 128 L229 146" stroke="#111" stroke-width="5.5"/><path d="M306 40 L334 62 L330 78" stroke="#111" stroke-width="2.2"/><path d="M286 86 L256 98 L244 118" stroke="#111" stroke-width="2.2"/><path d="M262 128 L276 150" stroke="#111" stroke-width="2.2"/><path d="M330 0 L306 40 L318 43 L286 86 L300 89 L262 128 L229 146" stroke="#fff" stroke-width="1.2" opacity=".85"/></g>
<!-- the courthouse -->
<g stroke="#111" stroke-width="1.6" fill="#fff">
  <!-- cupola and finial -->
  <path d="M200 36 L200 22" /><circle cx="200" cy="20" r="2.5" fill="#111"/>
  <path d="M184 64 Q184 40 200 36 Q216 40 216 64 Z"/>
  <path d="M188 64 Q190 46 200 40" fill="none" stroke-width=".9"/>
  <rect x="178" y="64" width="44" height="5"/>
  <!-- lantern stage with arches -->
  <rect x="180" y="69" width="40" height="30"/>
  <path d="M185 98 V80 Q189 74 193 80 V98 Z M196 98 V80 Q200 74 204 80 V98 Z M207 98 V80 Q211 74 215 80 V98 Z" fill="url(#hd)"/>
  <rect x="174" y="99" width="52" height="6"/>
  <!-- clock stage -->
  <rect x="172" y="105" width="56" height="58"/>
  <rect x="172" y="105" width="10" height="58" fill="url(#h)"/>
  <circle cx="200" cy="134" r="21"/>
  <circle cx="200" cy="134" r="17.5" stroke-width=".8"/>
  <g stroke-width="1.4">
    <path d="M200 117.5 V121 M200 147 V150.5 M183.5 134 H187 M213 134 H216.5"/>
    <path d="M208.2 119.8 L206.9 122 M214.3 125.8 L212 127.1 M214.3 142.2 L212 140.9 M208.2 148.2 L206.9 146 M191.8 148.2 L193.1 146 M185.7 142.2 L188 140.9 M185.7 125.8 L188 127.1 M191.8 119.8 L193.1 122" stroke-width="1"/>
  </g>
  <!-- stopped at 10:04 -->
  <path d="M200 134 L188.6 127.6" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M200 134 L202.7 118.6" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="200" cy="134" r="1.8" fill="#111"/>
  <rect x="166" y="163" width="68" height="7"/>
  <!-- tower base -->
  <rect x="176" y="170" width="48" height="26"/>
  <rect x="176" y="170" width="9" height="26" fill="url(#h)"/>
  <path d="M194 196 V182 Q200 175 206 182 V196 Z" fill="url(#hd)"/>
  <!-- pediment -->
  <path d="M96 222 L200 194 L304 222 Z"/>
  <path d="M112 219 L200 198 L288 219" fill="none" stroke-width=".8"/>
  <rect x="88" y="222" width="224" height="8"/>
  <!-- columns -->
  <rect x="96" y="230" width="208" height="64" fill="url(#hv)" opacity=".9"/>
  <g>
    <rect x="102" y="232" width="13" height="62"/><rect x="132" y="232" width="13" height="62"/><rect x="162" y="232" width="13" height="62"/>
    <rect x="225" y="232" width="13" height="62"/><rect x="255" y="232" width="13" height="62"/><rect x="285" y="232" width="13" height="62"/>
  </g>
  <g stroke-width=".7"><path d="M106 233 V293 M136 233 V293 M166 233 V293 M229 233 V293 M259 233 V293 M289 233 V293"/></g>
  <rect x="99" y="230" width="19" height="4"/><rect x="129" y="230" width="19" height="4"/><rect x="159" y="230" width="19" height="4"/>
  <rect x="222" y="230" width="19" height="4"/><rect x="252" y="230" width="19" height="4"/><rect x="282" y="230" width="19" height="4"/>
  <!-- doors -->
  <path d="M186 294 V252 Q200 238 214 252 V294 Z" fill="url(#hd)"/>
  <!-- wings -->
  <rect x="30" y="236" width="66" height="58"/><rect x="304" y="236" width="66" height="58"/>
  <rect x="30" y="236" width="66" height="58" fill="url(#h)" opacity=".35"/><rect x="304" y="236" width="66" height="58" fill="url(#h)" opacity=".35"/>
  <path d="M42 286 V258 Q48 250 54 258 V286 Z M70 286 V258 Q76 250 82 258 V286 Z M318 286 V258 Q324 250 330 258 V286 Z M346 286 V258 Q352 250 358 258 V286 Z" fill="url(#hd)"/>
  <rect x="26" y="230" width="74" height="6"/><rect x="300" y="230" width="74" height="6"/>
  <!-- steps -->
  <rect x="80" y="294" width="240" height="6"/><rect x="72" y="300" width="256" height="6"/><rect x="64" y="306" width="272" height="6"/>
</g>
<!-- ground and the square's lamp posts -->
<rect x="0" y="312" width="400" height="18" fill="url(#h)" opacity=".3"/>
<g stroke="#111" stroke-width="2"><path d="M14 312 V268 M386 312 V268"/></g>
<g fill="#111"><rect x="9" y="260" width="10" height="9" rx="2"/><rect x="381" y="260" width="10" height="9" rx="2"/></g>
</svg>
