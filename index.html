<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Movie Night Spinner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Archivo:wght@400;600;800&family=VT323&display=swap">
<style>
/* Layout: video shop after close. Wheel and LCD readout on the left, a cream VHS sleeve menu card on the right, stacked on phones. */
:root{
  --ink:#17141f;
  --panel:#221d2d;
  --cream:#f3e8cc;
  --cream-ink:#2a2230;
  --red:#e0452f;
  --orange:#ef7f2a;
  --gold:#f2b632;
  --teal:#2fa89a;
  --plum:#6b4c8a;
  --muted:#a59cb5;
  --line:rgba(243,232,204,.14);
  --lcd:#0e1a14;
  --lcd-text:#7cf0a8;
  --f-display:"Bungee","Arial Black",Impact,sans-serif;
  --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-lcd:"VT323","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--cream)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
.stripes{height:10px;display:flex}
.stripes i{flex:1}
.stripes i:nth-child(1){background:var(--red)}
.stripes i:nth-child(2){background:var(--orange)}
.stripes i:nth-child(3){background:var(--gold)}
.stripes i:nth-child(4){background:var(--teal)}
.stripes i:nth-child(5){background:var(--plum)}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:20px 24px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,6vw,52px);line-height:.95;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--gold)}
.sub{color:var(--muted);margin:8px 0 0;max-width:46ch}
.filter{display:flex;flex-direction:column;gap:6px;min-width:0}
.filter label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
select{font:inherit;font-weight:600;background:var(--panel);color:var(--cream);border:1px solid var(--line);border-radius:6px;padding:10px 12px;max-width:100%}
select:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}

.deck{display:flex;flex-direction:column;align-items:center;gap:16px;min-width:0}
.lcd{width:min(100%,520px);background:var(--lcd);border:3px solid #000;border-radius:8px;box-shadow:inset 0 0 0 2px #24382c;padding:8px 14px;font-family:var(--f-lcd);color:var(--lcd-text);display:flex;gap:12px;align-items:baseline;min-width:0}
.lcd .ch{font-size:20px;opacity:.7;flex:none}
.lcd .now{font-size:30px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-shadow:0 0 6px rgba(124,240,168,.45)}
.wheel-box{position:relative;width:min(100%,520px);aspect-ratio:1;max-width:100%}
.wheel-box canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--cream);filter:drop-shadow(0 3px 0 rgba(0,0,0,.5));z-index:2}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26%;aspect-ratio:1;border-radius:50%;border:5px solid var(--ink);background:var(--red);color:var(--cream);font-family:var(--f-display);font-size:clamp(16px,3.6vw,24px);cursor:pointer;box-shadow:0 0 0 3px var(--gold),0 6px 0 #000;transition:transform .12s}
.hub:hover{transform:translate(-50%,-52%)}
.hub:active{transform:translate(-50%,-48%)}
.hub:disabled{background:var(--plum);cursor:wait}
.count{font-size:13px;color:var(--muted);letter-spacing:.06em;font-variant-numeric:tabular-nums}

.history{width:min(100%,520px);display:flex;flex-direction:column;gap:8px}
.history h3{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:13px;background:var(--panel);color:var(--cream);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip:hover{border-color:var(--gold)}
.chips .empty{color:var(--muted);font-size:13px}

/* right column: printable menu preview */
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.preview{position:relative;width:100%;overflow:hidden;border-radius:3px;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.preview .mcard{position:absolute;left:0;top:0;transform-origin:0 0}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:inherit;font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;border:2px solid var(--cream);background:transparent;color:var(--cream);border-radius:4px;padding:10px 14px;cursor:pointer}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn:hover{background:var(--red);border-color:var(--red);color:var(--cream)}
.btn:disabled{opacity:.5;cursor:wait}
.status{font-size:13px;color:var(--muted);min-height:1em}

/* the menu itself: fixed A4 at 96dpi, styled per theme through variables */
.mcard{width:794px;height:1123px;overflow:hidden;background-color:var(--mg);background-image:var(--mpat,none);background-size:var(--mpsz,auto);color:var(--mi);font-family:var(--mb);font-size:18px;line-height:1.4}
.mc-strip{position:absolute;left:0;right:0;height:var(--sh,0px);background-image:var(--strip,none);background-size:var(--ssz,auto);background-repeat:repeat-x}
.mc-strip.top{top:0}.mc-strip.bot{bottom:0}
.mc-frame{position:absolute;left:34px;right:34px;top:calc(var(--sh,0px) + 26px);bottom:calc(var(--sh,0px) + 26px);border:var(--mf);background:var(--mfill,transparent);padding:10px}
.mc-inner{height:100%;border:var(--mf2,0 solid transparent);padding:30px 44px 26px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.mc-eye{font-family:var(--mb);font-weight:700;font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--ma)}
.mc-title{font-family:var(--md);font-weight:var(--mdw,400);font-size:84px;line-height:1.02;margin:12px 0 4px;color:var(--mt,var(--mi));text-transform:var(--mtt,none);letter-spacing:var(--mls,0);max-width:100%;overflow-wrap:break-word}
.mc-year{font-family:var(--mb);font-weight:700;font-size:17px;letter-spacing:.3em;color:var(--m2)}
.mc-tag{font-family:var(--mb);font-style:italic;font-size:22px;margin:14px 0 0;max-width:30em}
.mc-desc{font-size:17px;max-width:34em;margin:8px 0 0;opacity:.9}
.mc-cue{font-size:15px;max-width:38em;margin:10px 0 0;padding:8px 14px;border:1px dashed var(--ma);border-radius:3px}
.mc-cue b{display:block;font-family:var(--md);font-weight:var(--mdw,400);color:var(--ma);font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.mc-rule{width:120px;height:4px;background:var(--ma);margin:20px 0 16px;flex:none}
.mc-intro{font-size:17px;max-width:36em;margin:0 0 6px;opacity:.88}
.mc-courses{display:flex;flex-direction:column;gap:16px;width:100%;margin-top:12px;flex:1;justify-content:center}
.mc-course h3{font-family:var(--md);font-weight:var(--mdw,400);font-size:30px;margin:0 0 6px;color:var(--ma);text-transform:var(--mtt,none);letter-spacing:var(--mls,0);line-height:1.1}
.mc-item{margin:0 0 8px}
.mc-item b{display:block;font-weight:700;font-size:21px;line-height:1.25}
.mc-item span{display:block;font-size:16px;opacity:.82}
.mc-foot{font-family:var(--mb);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--m2);margin-top:10px}
.mc-stamp{position:absolute;right:18px;top:22px;transform:rotate(-12deg);border:4px solid var(--ma);color:var(--ma);font-family:var(--md);font-size:26px;padding:4px 14px;letter-spacing:.1em;opacity:.85}

#printArea{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  :root{padding:0}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea .mcard{transform:none!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;width:210mm;height:297mm}
}
.overlay{position:fixed;inset:0;background:rgba(10,8,14,.92);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.overlay img{max-height:78vh;max-width:100%;box-shadow:0 10px 30px #000}
.overlay p{margin:0;text-align:center;color:var(--cream);max-width:40ch}

@media (prefers-reduced-motion:reduce){.hub{transition:none}}
</style>

<div id="printArea"></div>
<div class="stripes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<div class="wrap">
  <header>
    <div>
      <h1>Movie Night <span>Spinner</span></h1>
      <p class="sub">Spin for a film. Every pick gets its own printable menu, styled to match the film: two snacks, a main or two, something sweet and a drink.</p>
    </div>
    <div class="filter">
      <label for="themeSel">Load the wheel with</label>
      <select id="themeSel"></select>
    </div>
  </header>

  <div class="stage">
    <section class="deck" aria-label="Spin wheel">
      <div class="lcd" aria-live="off"><span class="ch">CH 03</span><span class="now" id="now">Ready to spin</span></div>
      <div class="wheel-box">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" aria-label="Movie wheel"></canvas>
        <button class="hub" id="spin" type="button">Spin</button>
      </div>
      <div class="count" id="count"></div>
      <div class="history">
        <h3>Recent spins</h3>
        <div class="chips" id="chips"><span class="empty">Nothing yet. Your picks land here.</span></div>
      </div>
    </section>

    <section class="side" aria-live="polite" aria-label="Printable menu">
      <div class="preview" id="preview"></div>
      <div class="actions">
        <button class="btn primary" id="pdf" type="button">Save PDF to print</button>
        <button class="btn" id="print" type="button" hidden>Print</button>
        <button class="btn" id="png" type="button">Save image</button>
        <button class="btn" id="reroll" type="button">Shuffle the menu</button>
        <button class="btn" id="copy" type="button">Copy text</button>
      </div>
      <div class="status" id="status"></div>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const T={"redsauce": {"name": "Little Italy Sunday Gravy"}, "pizza": {"name": "Brooklyn Slice Joint"}, "deli": {"name": "Manhattan Deli Counter"}, "street": {"name": "Bodega and Street Cart"}, "cop": {"name": "Stakeout Snacks"}, "soul": {"name": "Harlem Soul Kitchen"}, "xmas": {"name": "Christmas in the City"}, "aussie": {"name": "Arvo in the Outback"}, "asian": {"name": "Chinatown Late Night"}, "scifi": {"name": "Mission Control Rations"}, "hero": {"name": "Rooftop Patrol"}, "kids": {"name": "Family Matinee"}, "teen": {"name": "Mall Food Court"}, "diner": {"name": "Roadside Diner"}, "mex": {"name": "Cantina Night"}, "tiki": {"name": "Beach House Luau"}, "uptown": {"name": "Uptown Steakhouse"}, "horror": {"name": "Midnight Monster Feast"}, "western": {"name": "Chuckwagon BBQ"}, "philly": {"name": "Philly Fight Night"}};
const PALETTE=["#e0452f","#ef7f2a","#f2b632","#2fa89a","#6b4c8a"];
/* every film has its own menu: T tagline, D description, P serve cue, S snacks, M mains, W sweet, K drink */
const FILMS=[{"title":"The Godfather","year":"1972","theme":"redsauce","T":"Family first. Cannoli second.","D":"A mafia patriarch hands the family business to his reluctant youngest son.","P":"Pour the Chianti when the wedding band starts up in the opening scene.","S":[["Connie's wedding antipasto","salami, provolone, olives, roast peppers, laid out like a garden party"],["Sicilian orange and fennel salad","for all those oranges on screen"],["Fried calamari","lemon and marinara"]],"M":[["Clemenza's Sunday sauce","fry the garlic, add tomatoes and paste, brown the sausage and meatballs, a splash of wine, a little sugar"],["Louis' veal scaloppine","lemon and capers, the best veal in the city"]],"W":[["Leave-the-gun cannoli","ricotta, choc chips, crushed pistachio"]],"K":[["Chianti","straw bottle on the table, refill without asking"]]},{"title":"The Godfather Part II","year":"1974","theme":"redsauce","T":"The family business goes international.","D":"Michael tightens his grip on the empire while young Vito's rise plays out in old New York.","P":"Serve the mains when the story moves to Havana for New Year's Eve.","S":[["Feast day arancini","young Vito's Little Italy, fried golden"],["Havana Cuban sliders","ham, roast pork, swiss, pickles, pressed flat"],["Lake Tahoe smoked trout pâté","water crackers on the side"]],"M":[["Vito's tenement baked ziti","ricotta and a mozzarella crust"],["Havana mojo pork","garlic, citrus, black beans and rice"]],"W":[["Hyman Roth's birthday cake","a sponge shaped like Cuba, cut and shared around the table"]],"K":[["Havana daiquiri","rum, lime, sugar, shaken hard"]]},{"title":"The Godfather Part III","year":"1990","theme":"redsauce","T":"The past never stays buried.","D":"An ageing Michael Corleone tries to buy his way into legitimacy through the Vatican.","P":"Hold the cannoli until the opera in the final act, and keep an eye on who made them.","S":[["Palermo panelle","chickpea fritters, salt and lemon"],["Caponata crostini","sweet and sour Sicilian eggplant"],["Prosciutto and melon","Don Altobello's opera box nibbles"]],"M":[["Mary and Vincent's gnocchi","hand-rolled in the kitchen, burnt butter and sage"],["Pasta alla Norma","eggplant, tomato, ricotta salata, straight from Sicily"]],"W":[["Opera night cannoli","ricotta and candied orange"]],"K":[["Nero d'Avola","Sicilian red"]]},{"title":"Goodfellas","year":"1990","theme":"redsauce","T":"As far back as I can remember, I always wanted seconds.","D":"A Brooklyn kid works his way up the mob ladder, from the cab stand to the Lufthansa heist.","P":"Plate up the mains when Paulie starts slicing garlic in the prison kitchen.","S":[["Razor-thin garlic bruschetta","sliced so fine it melts in the pan"],["Copacabana prawn cocktail","front row table, walked in through the kitchen"],["Bamboo Lounge salami and provolone","the crew's back booth"]],"M":[["Prison gravy with three-meat meatballs","veal, beef and pork, and go easy on the onions"],["Tommy's mum's 3am veal cutlets","crumbed, lemon, for boys who turn up late and hungry"]],"W":[["Lemon ice","a hot Brooklyn summer"]],"K":[["Scotch and soda","the drink of choice at the Bamboo Lounge"]]},{"title":"A Bronx Tale","year":"1993","theme":"redsauce","T":"The saddest thing in life is a wasted dinner.","D":"A bus driver's son is torn between his honest father and the neighbourhood boss.","P":"Do the car door test before dessert comes out.","S":[["Chez Bippy bar snacks","salted peanuts, olives, provolone cubes"],["Fried eggplant fingers","Belmont Avenue style"],["Doo-wop garlic knots","eaten on the stoop"]],"M":[["Sonny's Sunday rigatoni","gravy and meatballs"],["Lorenzo's bus driver hero","sausage and peppers wrapped for the route"]],"W":[["Arthur Avenue cannoli","Belmont's bakery, a box for Sonny"]],"K":[["Espresso with anisette","the bar after closing"]]},{"title":"Once Upon a Time in America","year":"1984","theme":"deli","T":"Fifty years of friendship, one very long dinner.","D":"Four Lower East Side street kids grow into Prohibition gangsters, and one of them betrays the rest.","P":"Bring the charlotte russe out when young Patsy sits on the stairs with his.","S":[["Delancey Street knishes","hot mustard"],["Speakeasy pickles","half and full sours"],["Bagel crisps with schmear","Lower East Side breakfast"]],"M":[["Fat Moe's back room brisket","slow braised, onions and gravy"],["Prohibition pastrami on rye","eaten in the speakeasy back room"]],"W":[["Patsy's charlotte russe","sponge, whipped cream, a cherry on top, try not to eat it on the stairs"]],"K":[["Bootleg whisky","served in a coffee cup"]]},{"title":"Carlito's Way","year":"1993","theme":"street","T":"One last score, then paradise.","D":"A Puerto Rican ex-con swears he's going straight, but his old life won't let him go.","P":"Have dessert on the table before the Grand Central finale.","S":[["Alcapurrias","fried green banana fritters with seasoned beef"],["Bacalaitos","crisp salt cod fritters"],["Tostones","smashed plantain, garlic mojo"]],"M":[["Pernil","slow roast pork shoulder, crackling, rice and pigeon peas"],["Mofongo with garlic prawns","mashed plantain, pork crackling, garlic"]],"W":[["Paradise flan","caramel, coconut, for the beach postcard dream"]],"K":[["Rum and cola","the bar at El Paraiso"]]},{"title":"Donnie Brasco","year":"1997","theme":"redsauce","T":"Forget about it.","D":"An undercover FBI agent gets too close to the tired hitman who vouches for him.","P":"Before the mains, explain all the meanings of \"forget about it\" to the table.","S":[["Social club antipasto","cured meats, giardiniera"],["Miami garlic prawns","the Florida trip"],["Fried mozzarella","marinara"]],"M":[["Shoes-on teriyaki steak","for the Japanese restaurant scene where nobody takes their shoes off"],["Lefty's Sunday gravy","meatballs and braciole"]],"W":[["Ricotta cheesecake","Lefty's sweet tooth"]],"K":[["Scotch on the rocks","Sonny Black's social club"]]},{"title":"Mean Streets","year":"1973","theme":"redsauce","T":"Sins in the street. Penance at the bar.","D":"A small-time hood in Little Italy tries to keep his reckless friend Johnny Boy out of trouble.","P":"Hit play on the jukebox and pour a round when Johnny Boy walks into Tony's bar.","S":[["San Gennaro sausage bites","charred, mustard"],["Fried calamari","lemon"],["Peppers on garlic bread","Charlie's uncle's restaurant"]],"M":[["Sausage and peppers hero","San Gennaro feast style"],["Penne arrabbiata","as hot as Johnny Boy's temper"]],"W":[["Zeppole","powdered sugar, straight from the street feast"]],"K":[["Red wine","poured from a jug"]]},{"title":"Casino","year":"1995","theme":"uptown","T":"Every muffin gets the same number of blueberries.","D":"A meticulous Vegas casino boss and his volatile enforcer mate lose their grip on the Tangiers.","P":"Bring out the muffins and count the blueberries before anyone takes one.","S":[["Tangiers prawn cocktail","buffet style"],["Oysters Rockefeller","high roller table"],["Card table chips and onion dip","the Tangiers poker room"]],"M":[["Tangiers rib eye","cooked exactly right, no excuses"],["Lobster tail","comped by the house"]],"W":[["Equal-blueberry muffins","count them, every one the same"]],"K":[["Dry martini","at the craps table"]]},{"title":"Scarface","year":"1983","theme":"uptown","T":"The world is yours. So is the last croqueta.","D":"A Cuban refugee claws his way to the top of Miami's underworld.","P":"Serve the mains when Tony first walks into the Babylon Club.","S":[["Little Havana lunch counter sliders","the sandwich stand Tony walked out of"],["Croquetas de jamón","Little Havana"],["Tostones","garlic mojo"]],"M":[["Ropa vieja","shredded beef, capsicum, rice and black beans"],["Babylon Club surf and turf","the nightclub where Tony makes a scene"]],"W":[["Guava pastelitos","flaky pastry, guava and cream cheese"]],"K":[["Mojito","Miami heat in a glass"]]},{"title":"The Untouchables","year":"1987","theme":"cop","T":"Never bring a knife to a gunfight. Bring a fork.","D":"Eliot Ness and const $=id=>document.getElementById(id);
const sel=$("themeSel");
sel.innerHTML=`<option value="all">Everything (${FILMS.length} films)</option>`+
  Object.entries(T).map(([k,t])=>`<option value="${k}">${t.name} (${FILMS.filter(f=>f.theme===k).length})</option>`).join("");

let list=[],rot=0,spinning=false,winner=-1,current=null,usedSig=false;
const canvas=$("wheel"),ctx=canvas.getContext("2d");

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function setList(){
  const v=sel.value;
  list=shuffle(v==="all"?FILMS:FILMS.filter(f=>f.theme===v));
  rot=0;winner=-1;draw();
  $("count").textContent=`${list.length} films on the wheel`;
}

function size(){
  const r=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);draw();
}

function draw(){
  const W=canvas.width;if(!W)return;
  const c=W/2,R=c*0.94,n=list.length,a=Math.PI*2/n;
  ctx.clearRect(0,0,W,W);
  /* rim */
  ctx.beginPath();ctx.arc(c,c,c*0.995,0,Math.PI*2);ctx.fillStyle="#0b0a10";ctx.fill();
  for(let i=0;i<n;i++){
    const s=rot+i*a-Math.PI/2;
    ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,R,s,s+a+0.0015);ctx.closePath();
    ctx.fillStyle=i===winner?"#f3e8cc":PALETTE[i%5];ctx.fill();
  }
  if(n<=60){
    ctx.strokeStyle="rgba(23,20,31,.6)";ctx.lineWidth=Math.max(1,W/500);
    for(let i=0;i<n;i++){const s=rot+i*a-Math.PI/2;ctx.beginPath();ctx.moveTo(c,c);ctx.lineTo(c+R*Math.cos(s),c+R*Math.sin(s));ctx.stroke()}
  }
  /* inner shade ring */
  const g=ctx.createRadialGradient(c,c,R*0.25,c,c,R);
  g.addColorStop(0,"rgba(23,20,31,.55)");g.addColorStop(.45,"rgba(23,20,31,0)");g.addColorStop(1,"rgba(23,20,31,.2)");
  ctx.beginPath();ctx.arc(c,c,R,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  /* marquee bulbs */
  const bulbs=28,br=(c-R)*0.38;
  for(let i=0;i<bulbs;i++){
    const t=i/bulbs*Math.PI*2+rot*0.15;
    ctx.beginPath();ctx.arc(c+(R+(c-R)*0.48)*Math.cos(t),c+(R+(c-R)*0.48)*Math.sin(t),br,0,Math.PI*2);
    ctx.fillStyle=i%2?"#f2b632":"#f3e8cc";ctx.fill();
  }
}

function indexAt(r){
  const n=list.length,a=Math.PI*2/n;
  const p=((-r)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
  return Math.floor(p/a)%n;
}

const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function spin(){
  if(spinning||!list.length)return;
  spinning=true;$("spin").disabled=true;winner=-1;
  const n=list.length,a=Math.PI*2/n,t=Math.floor(Math.random()*n);
  const target=-(t+0.5+(Math.random()-0.5)*0.6)*a;
  const start=rot,turns=reduce?1:6+Math.floor(Math.random()*3);
  const delta=((target-start)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)+turns*Math.PI*2;
  const dur=reduce?900:5200,t0=performance.now();
  const ease=x=>1-Math.pow(1-x,4);
  let last=-1;
  function frame(now){
    const p=Math.min(1,(now-t0)/dur);
    rot=start+delta*ease(p);draw();
    const i=indexAt(rot);
    if(i!==last){$("now").textContent=list[i].title;last=i}
    if(p<1)requestAnimationFrame(frame);
    else{
      rot=rot%(Math.PI*2);winner=indexAt(rot);draw();
      spinning=false;$("spin").disabled=false;
      const f=list[winner];
      $("now").textContent=`${f.title} (${f.year})`;
      show(f,true,"Tonight you're watching");addHistory(f);
    }
  }
  requestAnimationFrame(frame);
}

const toItem=([n,note])=>({n,note});
function makeMenu(f,first){
  if(first)return {s:f.S.slice(0,2).map(toItem),m:f.M.map(toItem),w:f.W.map(toItem),d:f.K.map(toItem)};
  return {s:shuffle(f.S).slice(0,2).map(toItem),m:shuffle(f.M).slice(0,Math.random()<.5?1:2).map(toItem),w:f.W.map(toItem),d:f.K.map(toItem)};
}

const ESC=s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const loadedFonts=new Set();
function ensureFonts(st){
  const fams=[[st.md,st.mdw?`wght@${st.mdw}`:""],[st.mb,st.bw]];
  const reqs=[];
  fams.forEach(([f,w])=>{
    const key=f+w;
    if(!loadedFonts.has(key)){
      loadedFonts.add(key);
      const l=document.createElement("link");l.rel="stylesheet";
      l.href=`https://fonts.googleapis.com/css2?family=${f.replace(/ /g,"+")}${w?":"+w:""}&display=swap`;
      document.head.appendChild(l);
      reqs.push(new Promise(r=>{l.onload=r;l.onerror=r}));
    }
  });
  return Promise.all(reqs).then(()=>Promise.race([
    Promise.all([document.fonts.load(`${st.mdw||400} 60px "${st.md}"`,"Aa"),document.fonts.load(`700 20px "${st.mb}"`,"Aa"),document.fonts.load(`400 20px "${st.mb}"`,"Aa")]),
    new Promise(r=>setTimeout(r,3500))
  ])).catch(()=>{});
}

function cardHTML(f,menu,tag){
  const st=STY[f.theme];
  const course=(label,items)=>`<div class="mc-course"><h3>${label}</h3>${items.map(it=>`<div class="mc-item"><b>${ESC(it.n)}</b>${it.note?`<span>${ESC(it.note)}</span>`:""}</div>`).join("")}</div>`;
  return `<div class="mc-strip top"></div><div class="mc-frame"><div class="mc-inner">
    ${st.stamp?`<div class="mc-stamp">${ESC(st.stamp)}</div>`:""}
    <div class="mc-eye">${ESC(st.eye)}</div>
    <div class="mc-title">${ESC(f.title)}</div>
    <div class="mc-year">${f.year}</div>
    <p class="mc-tag">${ESC(tag)}</p>
    <p class="mc-desc">${ESC(f.D)}</p>
    <div class="mc-rule"></div>
    <div class="mc-courses">
      ${course("Snacks",menu.s)}
      ${course(menu.m.length>1?"Mains":"Main",menu.m)}
      ${course("Something sweet",menu.w)}
      ${course("To drink",menu.d)}
    </div>
    <p class="mc-cue"><b>Showtime cue</b> ${ESC(f.P)}</p>
    <div class="mc-foot">${ESC(T[f.theme].name)}</div>
  </div></div><div class="mc-strip bot"></div>`;
}

function styleCard(el,f){
  const st=STY[f.theme];
  const vars={"--mg":st.mg,"--mi":st.mi,"--ma":st.ma,"--m2":st.m2,"--mf":st.mf,"--mf2":st.mf2,"--mfill":st.mfill,
    "--md":`"${st.md}",Georgia,serif`,"--mb":`"${st.mb}",Georgia,serif`,"--mdw":st.mdw,"--mtt":st.mtt,"--mls":st.mls,
    "--mpat":st.mpat,"--mpsz":st.mpsz,"--sh":st.sh,"--strip":st.strip,"--ssz":st.ssz};
  el.removeAttribute("style");
  for(const [k,v] of Object.entries(vars))if(v)el.style.setProperty(k,v);
}

/* shrink the title and the whole menu until it fits the A4 page */
function fit(el){
  const title=el.querySelector(".mc-title"),inner=el.querySelector(".mc-inner");
  let size=f=>{title.style.fontSize=f+"px"};
  let fs=96;size(fs);
  while(fs>40&&(title.scrollHeight>fs*1.05*2.15||title.scrollWidth>title.clientWidth+1)){fs-=4;size(fs)}
  let scale=1;el.style.setProperty("--k","1");
  const items=el.querySelectorAll(".mc-item b,.mc-item span,.mc-cue,.mc-tag,.mc-desc,.mc-course h3");
  items.forEach(n=>n.dataset.base=n.dataset.base||parseFloat(getComputedStyle(n).fontSize));
  while(inner.scrollHeight>inner.clientHeight+1&&scale>0.7){
    scale-=0.04;items.forEach(n=>n.style.fontSize=(n.dataset.base*scale)+"px");
    if(fs>48){fs-=4;size(fs)}
  }
}

const preview=$("preview");
const card=document.createElement("div");card.className="mcard";preview.appendChild(card);
function scalePreview(){const k=preview.clientWidth/794;card.style.transform=`scale(${k})`;preview.style.height=(1123*k)+"px"}
window.addEventListener("resize",scalePreview);

let renderId=0;
async function show(f,preferSig){
  const id=++renderId;
  current=f;
  const menu=makeMenu(f,preferSig);
  const tag=f.T;
  current.menu=menu;current.tag=tag;
  $("status").textContent="";
  await ensureFonts(STY[f.theme]);
  if(id!==renderId)return;
  styleCard(card,f);
  card.innerHTML=cardHTML(f,menu,tag);
  scalePreview();
  fit(card);
}

/* history */
let hist=[];
try{hist=JSON.parse(localStorage.getItem("mns-hist")||"[]")}catch(e){hist=[]}
function renderHist(){
  const box=$("chips");
  const items=hist.map(id=>FILMS.find(f=>f.id===id)).filter(Boolean);
  if(!items.length){box.innerHTML='<span class="empty">Nothing yet. Your picks land here.</span>';return}
  box.innerHTML="";
  items.forEach(f=>{const b=document.createElement("button");b.className="chip";b.type="button";b.textContent=f.title;b.addEventListener("click",()=>show(f,true));box.appendChild(b)});
}
function addHistory(f){
  hist=[f.id,...hist.filter(x=>x!==f.id)].slice(0,8);
  try{localStorage.setItem("mns-hist",JSON.stringify(hist))}catch(e){}
  renderHist();
}

function menuText(){
  if(!current)return"";
  const m=current.menu,line=it=>`- ${it.n}${it.note?`, ${it.note}`:""}`;
  return `${current.title} (${current.year})\n${current.tag}\n${current.D}\n\nSnacks\n${m.s.map(line).join("\n")}\n\n${m.m.length>1?"Mains":"Main"}\n${m.m.map(line).join("\n")}\n\nSomething sweet\n${m.w.map(line).join("\n")}\n\nTo drink\n${m.d.map(line).join("\n")}\n\nShowtime cue: ${current.P}`;
}

/* export: render a clean copy of the card at full size */
async function renderCanvas(){
  const stage=document.createElement("div");
  stage.style.cssText="position:fixed;left:-20000px;top:0;width:794px;height:1123px;";
  const clone=card.cloneNode(true);clone.style.transform="none";
  stage.appendChild(clone);document.body.appendChild(stage);
  try{
    await document.fonts.ready;
    return await html2canvas(clone,{scale:2.5,backgroundColor:STY[current.theme].mg,logging:false,useCORS:true});
  }finally{stage.remove()}
}
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

let downloads=null;
const inClaude=!!(window.claude&&window.claude.use);
if(inClaude){window.claude.use("downloads").then(d=>{downloads=d}).catch(()=>{})}
else{$("print").hidden=false}
function plainDownload(data,filename){
  const url=URL.createObjectURL(data),a=document.createElement("a");
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

function showOverlay(url){
  const o=document.createElement("div");o.className="overlay";
  o.innerHTML=`<img alt="Menu for ${ESC(current.title)}"><p>Saving straight to a file isn't available here. Long-press or right-click the menu to save it, then print it from your photos or files.</p><button class="btn primary" type="button">Close</button>`;
  o.querySelector("img").src=url;
  o.querySelector("button").addEventListener("click",()=>o.remove());
  document.body.appendChild(o);
}

async function exportMenu(kind){
  if(!current||typeof html2canvas==="undefined"){$("status").textContent="Still loading the export tools, try again in a second.";return}
  const btns=[$("pdf"),$("png")];btns.forEach(b=>b.disabled=true);
  $("status").textContent=kind==="pdf"?"Building your A4 PDF...":"Building your image...";
  try{
    const canvas=await renderCanvas();
    const name=`${slug(current.title)}-${current.year}-menu`;
    let data,filename;
    if(kind==="pdf"){
      const {jsPDF}=window.jspdf;
      const pdf=new jsPDF({unit:"mm",format:"a4",orientation:"portrait"});
      pdf.addImage(canvas.toDataURL("image/jpeg",0.92),"JPEG",0,0,210,297);
      data=pdf.output("blob");filename=name+".pdf";
    }else{
      data=await new Promise(r=>canvas.toBlob(r,"image/png"));filename=name+".png";
    }
    if(downloads){
      try{await downloads.save({filename,data});$("status").textContent=`Saved ${filename}. Print it at A4, actual size.`}
      catch(e){
        if(e&&e.code==="declined")$("status").textContent="Save cancelled.";
        else{showOverlay(canvas.toDataURL("image/png"));$("status").textContent=""}
      }
    }else if(!inClaude){plainDownload(data,filename);$("status").textContent=`Downloaded ${filename}. Print it at A4, actual size.`}
    else{showOverlay(canvas.toDataURL("image/png"));$("status").textContent=""}
  }catch(e){$("status").textContent="Couldn't build the file. Try again."}
  finally{btns.forEach(b=>b.disabled=false)}
}

$("spin").addEventListener("click",spin);
sel.addEventListener("change",setList);
$("reroll").addEventListener("click",()=>{if(current)show(current,false)});
$("pdf").addEventListener("click",()=>exportMenu("pdf"));
$("png").addEventListener("click",()=>exportMenu("png"));
$("print").addEventListener("click",()=>{
  const pa=$("printArea");pa.innerHTML="";
  const c=card.cloneNode(true);c.style.transform="none";pa.appendChild(c);
  window.print();
});
$("copy").addEventListener("click",()=>{
  const txt=menuText();
  const done=()=>{$("status").textContent="Menu copied as text."};
  const fail=()=>{
    const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");done()}catch(e){$("status").textContent="Copy is blocked here."}
    ta.remove();
  };
  try{navigator.clipboard.writeText(txt).then(done,fail)}catch(e){fail()}
});
window.addEventListener("resize",size);

setList();size();renderHist();scalePreview();
show(FILMS.find(f=>f.id==="Ghostbusters (1984)"),true);
