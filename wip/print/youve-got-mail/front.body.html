<div style="position: relative; width: 528px; height: 816px; overflow: hidden; background: #faf7f0; font-family: 'EB Garamond', Garamond, serif; color: #231a17">
  <div style="position: absolute; left: 0; top: 0; width: 528px; height: 350px; background: #6a1824"></div>
  <div style="position: absolute; left: 0; top: 350px; width: 528px; height: 3px; background: #231a17"></div>
  <section style="position: absolute; left: 0; top: 0; width: 528px; height: 816px; box-sizing: border-box; padding: 34px 40px 40px; display: flex; flex-direction: column">
    <style>section > * { flex-shrink: 0 }</style>

    {{LOCKUP}}
    <div style="margin-top: 11px; display: flex; align-items: center; gap: 14px">
      <div style="flex: 1; height: 1px; background: #d9c6a6"></div>
      <div style="font-family: 'Cinzel', serif; font-weight: 600; font-size: 15px; letter-spacing: 0.34em; line-height: 1; color: #f3e9d5; padding-left: 0.34em; text-shadow: -0.5px 0 0 rgba(170, 40, 70, 0.7)">THE CAFE</div>
      <div style="flex: 1; height: 1px; background: #d9c6a6"></div>
    </div>

    <figure style="margin: 15px 0 0; position: relative; width: 448px; height: 184px">
      <div style="position: absolute; left: 3px; top: 4px; width: 448px; height: 184px; background: rgba(20, 2, 6, 0.45)"></div>
      <img src="assets/storefront-screened.jpg" alt="The Fox and Sons Books storefront on the Upper West Side" style="position: absolute; left: 0; top: 0; display: block; width: 448px; height: 184px; border: 2px solid #f3e9d5; box-sizing: border-box">
    </figure>
    <p style="margin: 10px 0 0; font-style: italic; font-size: 16px; line-height: 1.3; color: #f3e9d5; text-align: center">Now open on the Upper West Side. Deep armchairs, good coffee.</p>

    <div style="margin-top: 20px">
      {{BAR}}
    </div>

    <div style="margin-top: auto; border-top: 1px solid #6a1824; border-bottom: 1px solid #6a1824; padding: 8px 0 9px; display: flex; gap: 16px; align-items: flex-start">
      <div style="flex: 1.15">
        <div style="font-family: 'Cinzel', serif; font-weight: 700; font-size: 12px; letter-spacing: 0.16em; color: #6a1824">HOW TO ORDER</div>
        <p style="margin: 2px 0 0; font-size: 16px; line-height: 1.25">Size, then caf or decaf, then the drink. <i>Tall. Decaf. Cappuccino.</i></p>
      </div>
      <div style="width: 1px; align-self: stretch; background: #c9b79a"></div>
      <div style="flex: 1">
        <div style="font-family: 'Cinzel', serif; font-weight: 700; font-size: 12px; letter-spacing: 0.16em; color: #6a1824">YOUR WAY</div>
        <p style="margin: 2px 0 0; font-size: 16px; line-height: 1.25">Light or dark roast. Low-fat or non-fat. Extra shot .55</p>
      </div>
    </div>
  </section>
</div>
