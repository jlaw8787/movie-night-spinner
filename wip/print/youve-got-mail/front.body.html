<div style="position: relative; width: 528px; height: 816px; overflow: hidden; background: #f5efe1; font-family: 'Libre Franklin', 'Franklin Gothic Book', Arial, sans-serif; color: #241a16">
  <section style="position: absolute; left: 0; top: 0; width: 528px; height: 816px; box-sizing: border-box; padding: 40px 40px 40px; display: flex; flex-direction: column">

    {{WORDMARK}}
    <div style="margin-top: 12px; display: flex; align-items: center; gap: 12px">
      <div style="flex: 1; height: 4px; border-top: 1px solid #7a1f2b; border-bottom: 1px solid #7a1f2b"></div>
      <img src="assets/cup.png" alt="" style="display: block; width: 32px; height: 26px">
      <div style="font-family: 'Bodoni Moda', serif; font-weight: 500; font-style: italic; font-size: 26px; line-height: 1; color: #7a1f2b">The Cafe</div>
      <div style="flex: 1; height: 4px; border-top: 1px solid #7a1f2b; border-bottom: 1px solid #7a1f2b"></div>
    </div>

    <figure style="margin: 16px 0 0; display: flex; flex-direction: column; gap: 6px">
      <img src="assets/storefront.jpg" alt="The Fox and Sons Books storefront" style="display: block; width: 448px; height: 188px; object-fit: cover; object-position: 50% 40%; border: 1px solid #241a16; box-sizing: border-box">
      <figcaption style="font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 14px; line-height: 1.3; color: #5e5047; text-align: center">Our new store on the Upper West Side, now open.</figcaption>
    </figure>

    <div style="margin-top: 16px">
      {{BAR}}
    </div>

    <div style="margin-top: auto; border: 1.5px solid #7a1f2b; padding: 10px 14px 11px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <div style="font-family: 'Bodoni Moda', serif; font-weight: 700; font-size: 18px; color: #7a1f2b">How would you like it?</div>
        <div style="font-size: 12.5px; color: #5e5047">No charge for decaf.</div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; row-gap: 3px; column-gap: 14px; font-size: 15px; line-height: 1.3">
        <div>Short or tall.</div><div>Light or dark.</div>
        <div>Caf or decaf.</div><div>Low-fat or non-fat.</div>
      </div>
    </div>
  </section>
</div>
