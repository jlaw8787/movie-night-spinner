<div style="position: relative; width: 1123px; height: 794px; overflow: hidden; background: #f3ecd8; font-family: 'Libre Franklin', 'Franklin Gothic Medium', Arial, sans-serif; color: #16170f">

  <!-- Panel 1: the menu, by outlet -->
  <section style="position: absolute; left: 0; top: 0; width: 379px; height: 794px; box-sizing: border-box; padding: 40px 36px 51px 40px; display: flex; flex-direction: column; background: #f3ecd8">
    <div style="font-weight: 700; font-size: 12.5px; letter-spacing: 0.16em; color: #b5241a">WHERE TO EAT AND DRINK</div>
    <h2 style="margin: 6px 0 0; align-self: flex-start; font-weight: 900; font-size: 34px; line-height: 1; text-transform: uppercase; background: #16170f; color: #f3ecd8; padding: 6px 12px 5px">The Menu</h2>
    <div style="margin-top: 12px; height: 3px; background: #16170f"></div>
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding-top: 8px">
      {{OUTLETS}}
    </div>
  </section>

  <!-- Panels 2 and 3: the guest map spread -->
  <section style="position: absolute; left: 379px; top: 0; width: 744px; height: 794px; box-sizing: border-box; padding: 40px 38px 40px 37px; background: #f3ecd8; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div>
        <div style="font-weight: 700; font-size: 12.5px; letter-spacing: 0.16em; color: #b5241a">GUEST MAP</div>
        <h2 style="margin: 6px 0 0; display: inline-block; font-weight: 900; font-size: 34px; line-height: 1; text-transform: uppercase; background: #16170f; color: #f3ecd8; padding: 6px 12px 5px">Isla Nublar</h2>
      </div>
      <div style="display: flex; gap: 12px; font-size: 12px; padding-bottom: 5px">
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 20px; height: 20px; border-radius: 50%; background: #b5241a; border: 2px solid #ffffff; box-shadow: 0 0 0 1px #16170f; box-sizing: border-box; color: #ffffff; font-weight: 900; font-size: 11px; line-height: 16px; text-align: center; display: inline-block">1</span>Food</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="display: inline-flex; border: 1px solid #16170f"><span style="width: 5px; height: 4px; background: #16170f; display: inline-block"></span><span style="width: 5px; height: 4px; background: #f2b21b; display: inline-block"></span><span style="width: 5px; height: 4px; background: #16170f; display: inline-block"></span><span style="width: 5px; height: 4px; background: #f2b21b; display: inline-block"></span><span style="width: 5px; height: 4px; background: #16170f; display: inline-block"></span><span style="width: 5px; height: 4px; background: #f2b21b; display: inline-block"></span></span>Electric fence</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 22px; height: 6px; background: #decb97; border: 1px solid #7a6440; display: inline-block"></span>Tour road</span>
      </div>
    </div>
    <div style="margin-top: 12px; height: 3px; background: #16170f"></div>
    <div style="position: relative; margin-top: 14px; width: 669px; height: 584px; border: 4px solid #16170f; box-sizing: border-box; overflow: hidden; background: #2c6a80">
      <img src="{{IMG_MAP}}" alt="Illustrated map of Isla Nublar" style="position: absolute; left: 0; top: 0; width: 661px; height: 592px; display: block">
      {{MAP_LABELS}}
    </div>
    <div style="margin-top: auto; display: flex; justify-content: space-between; font-size: 12.5px; color: #4b4e42"><span>Please stay in your tour car at all times.</span><span style="font-weight: 800; letter-spacing: 0.08em; color: #133a2a">MAP NOT TO SCALE</span></div>
  </section>
  <div style="position: absolute; left: 379px; top: 0; width: 1px; height: 12px; background: rgba(0,0,0,0.4)"></div>
  <div style="position: absolute; left: 758px; top: 0; width: 1px; height: 12px; background: rgba(0,0,0,0.4)"></div>
</div>
