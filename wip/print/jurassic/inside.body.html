<div style="position: relative; width: 1123px; height: 794px; overflow: hidden; background: #f4eedb; font-family: 'Archivo', Arial, sans-serif; color: #15170f">

  <!-- Panel 1: the menu -->
  <section style="position: absolute; left: 0; top: 0; width: 376px; height: 794px; box-sizing: border-box; padding: 0 30px 26px 44px; display: flex; flex-direction: column; background: #f4eedb">
    {{LIVERY_MENU}}
    <div style="margin-top: 44px; display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 5px solid #15170f; padding-bottom: 8px">
      <div>
        <div style="font-weight: 700; font-stretch: 75%; font-size: 14px; letter-spacing: 0.16em; color: #b8261a">WHERE TO EAT AND DRINK</div>
        <h2 style="margin: 2px 0 0; font-weight: 900; font-stretch: 68%; font-size: 42px; line-height: 0.95; text-transform: uppercase">The Menu</h2>
      </div>
      <div style="font-size: 12.5px; line-height: 1.3; color: #4b4f43; text-align: right; padding-bottom: 4px">Numbers match<br>the guest map</div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding-top: 4px">
      {{DISHES}}
    </div>
  </section>

  <!-- Panels 2 and 3: the guest map spread -->
  <section style="position: absolute; left: 376px; top: 0; width: 747px; height: 794px; box-sizing: border-box; padding: 0 44px 28px 34px; background: #ebe2c5; display: flex; flex-direction: column">
    {{LIVERY_MAP}}
    <div style="margin-top: 44px; display: flex; justify-content: space-between; align-items: flex-end">
      <div>
        <div style="font-weight: 700; font-stretch: 75%; font-size: 14px; letter-spacing: 0.16em; color: #b8261a">GUEST MAP</div>
        <h2 style="margin: 2px 0 0; font-weight: 900; font-stretch: 68%; font-size: 46px; line-height: 0.95; text-transform: uppercase">Isla Nublar</h2>
      </div>
      <div style="display: flex; gap: 16px; font-size: 13px; padding-bottom: 6px">
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 18px; height: 18px; border-radius: 50%; background: #b8261a; border: 2px solid #ffffff; box-shadow: 0 0 0 1px #15170f; display: inline-block"></span>Dining stop</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 22px; height: 5px; background: #f2b21b; border: 1px solid #15170f; display: inline-block"></span>Electric fence</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 22px; height: 6px; background: #decb97; border: 1px solid #7a6440; display: inline-block"></span>Tour road</span>
      </div>
    </div>
    <div style="position: relative; margin-top: 12px; width: 669px; height: 600px; border: 4px solid #15170f; box-sizing: border-box; overflow: hidden; background: #2c6a80">
      <img src="{{IMG_MAP}}" alt="Illustrated map of Isla Nublar" style="position: absolute; left: 0; top: 0; width: 661px; height: 592px; display: block">
      {{MAP_LABELS}}
    </div>
    <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: #4b4f43">
      <span>Tour cars follow the tour road. Please stay in your vehicle at all times.</span>
      <span style="font-weight: 800; font-stretch: 75%; letter-spacing: 0.08em; color: #123628">AN INGEN ATTRACTION</span>
    </div>
  </section>
  <div style="position: absolute; left: 376px; top: 0; width: 1px; height: 12px; background: rgba(0,0,0,0.4)"></div>
  <div style="position: absolute; left: 752px; top: 0; width: 1px; height: 12px; background: rgba(0,0,0,0.4)"></div>
</div>
