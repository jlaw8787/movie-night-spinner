<!-- Outside of the folded bulletin: page 4 (advertisers) on the left, page 1 (cover) on the right.
     The cover art, rules and masthead are the bulletin company's preprinted two-colour stock;
     the Mass times and the ads were imprinted in black by the parish printer. -->
<div style="position: absolute; left: 0; top: 0; width: 1056px; height: 816px; color: {{INK}}">

  <!-- PAGE 4: advertisers -->
  <section style="position: absolute; left: 44px; top: 40px; width: 450px; height: 736px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="flex: 1; height: 2px; background: {{OCHRE}}"></span>
      <span style="font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 16px; line-height: 1; letter-spacing: 0.16em; color: {{OCHRE_TXT}}">PLEASE PATRONIZE OUR ADVERTISERS</span>
      <span style="flex: 1; height: 2px; background: {{OCHRE}}"></span>
    </div>
    <div style="margin-top: 5px; text-align: center; font-family: 'Old Standard TT', serif; font-style: italic; font-size: 14px; line-height: 1.2">They make this bulletin possible. Tell them you saw it here.</div>
    <div style="position: absolute; left: 0; top: 50px; width: 450px; height: 646px; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 7px">
      {{ADS}}
    </div>
    <div style="position: absolute; left: 0; top: 712px; width: 450px; display: flex; justify-content: space-between; font-family: 'Old Standard TT', serif; font-size: 13px; line-height: 1.3">
      <span>For space on this page call the rectory.</span><span>Church Press, Brooklyn, N.Y. 1987</span>
    </div>
  </section>

  <!-- PAGE 1: cover -->
  <section style="position: absolute; left: 562px; top: 40px; width: 450px; height: 736px">
    <div style="height: 3px; background: {{OCHRE}}"></div>
    <div style="margin-top: 3px; height: 1px; background: {{OCHRE}}"></div>
    <div style="margin-top: 10px; text-align: center; font-family: 'UnifrakturMaguntia', serif; font-size: {{MAST}}px; line-height: 1; color: {{INK}}">St. Cecilia&#8217;s Church</div>
    <div style="margin-top: 7px; text-align: center; font-family: 'Old Standard TT', serif; font-weight: 700; font-size: 14px; line-height: 1; letter-spacing: 0.32em; padding-left: 0.32em">BROOKLYN, NEW YORK</div>
    <div style="margin-top: 11px; height: 1px; background: {{OCHRE}}"></div>
    <div style="margin-top: 3px; height: 3px; background: {{OCHRE}}"></div>

    <div style="position: absolute; left: 0; top: 140px; width: 450px; height: 302px; overflow: hidden">
      <img src="assets/cover-church-linecut.png" alt="Engraving of the church on its block under a full moon" style="position: absolute; left: 1px; top: 1px; width: 448px; height: 300px; display: block">
      <div style="position: absolute; left: 0; top: 0; width: 448px; height: 300px; border: 1px solid {{INK}}"></div>
    </div>
    <div style="position: absolute; left: 0; top: 450px; width: 450px; display: flex; justify-content: space-between; font-family: 'Old Standard TT', serif; font-size: 14px; line-height: 1">

    </div>

    <!-- imprinted by the parish: pasted-up typewriter copy -->
    <div style="position: absolute; left: -6px; top: 474px; width: 460px; height: 264px; box-sizing: border-box; border: 1px solid rgba(60,52,40,0.09)"></div>
    <div style="position: absolute; left: 0; top: 482px; width: 450px; display: flex; gap: 22px">
      <div style="width: 214px">{{COVER_L}}</div>
      <div style="width: 214px">{{COVER_R}}</div>
    </div>
  </section>
