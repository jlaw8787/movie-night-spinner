<div style="position: absolute; left: 0; top: 0; width: 816px; height: 1056px; font-family: 'EB Garamond', Georgia, serif; color: #2b2622">

  <!-- Masthead -->
  <header style="position: absolute; left: 56px; top: 50px; width: 704px; text-align: center">
    <div style="font-weight: 600; font-size: 15px; letter-spacing: 0.44em; padding-left: 0.44em; color: #8e2a28">RISTORANTE</div>
    <div style="font-family: 'Pinyon Script', cursive; font-size: 80px; line-height: 1.04; color: #1c2642; margin-top: 2px">Lume di Luna</div>
    <div style="font-style: italic; font-size: 18px; line-height: 1.3; color: #4a4339; margin-top: 2px">Cucina italiana. Dinner nightly from five o’clock.</div>
  </header>

  <!-- Double rule in the red ink -->
  <div style="position: absolute; left: 56px; top: 196px; width: 704px; height: 2px; background: #8e2a28"></div>
  <div style="position: absolute; left: 56px; top: 201px; width: 704px; height: 1px; background: #8e2a28"></div>

  <!-- The painted art, two inks -->
  <div style="position: absolute; left: 56px; top: 218px; width: 704px; height: 262px; box-sizing: border-box; border: 2px solid #1c2642; overflow: hidden; background: #111729">
    <img src="{{IMG_ART}}" alt="A full moon over the bridge and the river" style="position: absolute; left: -2px; top: -14px; width: 704px; height: 300px; display: block">
  </div>

  <!-- Left column -->
  <section style="position: absolute; left: 56px; top: 512px; width: 330px">
    {{FRONT_LEFT}}
  </section>

  <!-- Right column -->
  <section style="position: absolute; left: 430px; top: 512px; width: 330px">
    {{FRONT_RIGHT}}
  </section>

  <div style="position: absolute; left: 408px; top: 526px; width: 1px; height: 436px; background: rgba(142,42,40,0.45)"></div>

  <div style="position: absolute; left: 56px; top: 988px; width: 704px; text-align: center; font-style: italic; font-size: 16px; color: #4a4339">Dolci, caffè, the bar and our late supper are on the back.</div>
</div>
