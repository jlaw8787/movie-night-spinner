<div style="position: absolute; left: 0; top: 0; width: 816px; height: 1056px; font-family: 'EB Garamond', Georgia, serif; color: #2b2622">

  <!-- Small masthead with the moon mark -->
  <header style="position: absolute; left: 56px; top: 50px; width: 704px; display: flex; align-items: center; justify-content: center; gap: 18px">
    <img src="{{IMG_MARK}}" alt="" style="display: block; width: 58px; height: 58px">
    <div style="font-family: 'Pinyon Script', cursive; font-size: 50px; line-height: 1.1; color: #1c2642">Lume di Luna</div>
  </header>
  <div style="position: absolute; left: 56px; top: 132px; width: 704px; height: 2px; background: #8e2a28"></div>
  <div style="position: absolute; left: 56px; top: 137px; width: 704px; height: 1px; background: #8e2a28"></div>

  <section style="position: absolute; left: 56px; top: 162px; width: 330px">
    {{BACK_LEFT}}
  </section>
  <section style="position: absolute; left: 430px; top: 162px; width: 330px">
    {{BACK_RIGHT}}
  </section>
  <div style="position: absolute; left: 408px; top: 176px; width: 1px; height: {{DIV_H}}px; background: rgba(142,42,40,0.45)"></div>

  <!-- Late supper, printed as a navy panel with the type knocked out -->
  <section style="position: absolute; left: 56px; top: {{LATE_TOP}}px; width: 704px; box-sizing: border-box; background: #1c2642; color: #f4ecd9; padding: 22px 30px 24px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px">
      <div style="font-weight: 600; font-size: 17px; letter-spacing: 0.28em; color: #f4ecd9">DOPO L’OPERA</div>
      <div style="font-style: italic; font-size: 17px; color: #e6dcc4">After the Met, late supper from 10 p.m. to 1 a.m.</div>
    </div>
    <div style="height: 1px; background: rgba(244,236,217,0.5); margin-top: 10px"></div>
    <div style="display: flex; gap: 40px; margin-top: 4px">
      {{LATE}}
    </div>
  </section>

  <footer style="position: absolute; left: 56px; top: {{FOOT_TOP}}px; width: 704px; text-align: center; font-size: 16px; line-height: 1.5; color: #4a4339">
    <div style="font-style: italic">Water on request. Proposals welcome. Please kneel.</div>
    <div>Private parties in the back room. Cash and major credit cards. Tax not included.</div>
  </footer>
</div>
